<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金钱剪刀 · 接单台</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    * { box-sizing: border-box; }
    :root {
      --bg: #f5f0e8;
      --surface: #fffcf0;
      --line: rgba(200, 149, 42, 0.22);
      --gold: #c8952a;
      --gold-deep: #b8821e;
      --ink: #1a1209;
      --muted: #7d6b48;
      --soft: #f5e8c0;
      --green: #2f8f50;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    main {
      margin: 0 auto;
      max-width: 1120px;
      padding: 28px 18px 60px;
    }
    .hero {
      align-items: flex-end;
      display: flex;
      gap: 18px;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: var(--gold-deep);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
      margin: 0 0 8px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0;
    }
    .hero-actions,
    .order-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      align-items: center;
      border-radius: 999px;
      display: inline-flex;
      font-size: 14px;
      font-weight: 850;
      justify-content: center;
      min-height: 38px;
      padding: 0 16px;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.primary {
      background: linear-gradient(135deg, #b8821e, #c8952a, #e8b84b);
      color: #fff;
    }
    .btn.secondary {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--gold-deep);
    }
    .stats {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 18px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 15px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .stat-value {
      color: var(--ink);
      font-size: 22px;
      font-weight: 900;
    }
    .section-head {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin: 20px 0 12px;
    }
    .section-head h2 {
      font-size: 19px;
      margin: 0;
    }
    .updated {
      color: var(--muted);
      font-size: 12px;
    }
    .orders {
      display: grid;
      gap: 12px;
    }
    .order {
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      display: grid;
      gap: 14px;
      grid-template-columns: auto minmax(0, 1fr) auto;
      padding: 16px;
    }
    .order-id {
      align-items: center;
      background: var(--gold);
      border-radius: 10px;
      color: #fff;
      display: flex;
      font-size: 18px;
      font-weight: 900;
      height: 42px;
      justify-content: center;
      width: 42px;
    }
    .order-title {
      font-size: 17px;
      font-weight: 850;
      margin-bottom: 7px;
      line-height: 1.35;
    }
    .task-demand {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.65;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    .meta {
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      font-size: 13px;
      gap: 8px;
    }
    .pill {
      background: var(--soft);
      border-radius: 999px;
      color: var(--gold-deep);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 9px;
    }
    .pill.done { background: #e6f5ea; color: var(--green); }
    .empty {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      padding: 26px;
      text-align: center;
    }
    .error {
      background: #fff1eb;
      border: 1px solid #f0b9a2;
      border-radius: 12px;
      color: #9f3d1d;
      display: none;
      margin: 14px 0;
      padding: 14px;
    }
    .error.visible { display: block; }
    :root {
      --bg-1: #f4ecce;
      --bg-2: #e9d9a4;
      --bg-3: #ddc98c;
      --card: #fdf7e6;
      --card-hot: #fffaf0;
      --path-line: #efcd8e;
      --path-gold: #e8902f;
      --path-gold-dark: #c77b2a;
      --path-text: #352f20;
      --path-soft: #8a7a55;
      --path-faint: #a3926a;
    }
    body {
      background: linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      color: var(--path-text);
    }
    main.wrap {
      max-width: 1120px;
      padding: 22px 30px 50px;
    }
    .hero-map {
      align-items: center;
      background: var(--card);
      border: 2px solid var(--path-line);
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(180, 140, 60, 0.16);
      display: flex;
      gap: 16px;
      margin-bottom: 22px;
      min-height: 72px;
      padding: 14px 22px;
      position: relative;
    }
    .hero-badge {
      background: var(--path-gold);
      border-radius: 7px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      left: 18px;
      padding: 2px 10px;
      position: absolute;
      top: -10px;
    }
    .hero-emoji {
      flex: 0 0 auto;
      font-size: 30px;
      line-height: 1;
    }
    .hero-copy {
      display: grid;
      flex: 1;
      gap: 4px;
      min-width: 0;
    }
    .hero-titleline {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }
    .hero-meta {
      color: var(--path-faint);
      font-size: 12px;
      font-weight: 800;
    }
    .hero-title {
      color: var(--path-text);
      font-size: 19px;
      font-weight: 900;
    }
    .hero-goal {
      color: var(--path-soft);
      font-size: 13px;
      line-height: 1.45;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
    .tag {
      border: 1px solid #f0b27a;
      border-radius: 6px;
      color: #e07d2c;
      font-size: 11px;
      font-weight: 900;
      padding: 1px 8px;
      white-space: nowrap;
    }
    .path-btn {
      align-items: center;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      font-size: 14px;
      font-weight: 900;
      justify-content: center;
      min-height: 39px;
      padding: 9px 15px;
      text-decoration: none;
      white-space: nowrap;
    }
    .path-btn.primary {
      background: var(--path-gold);
      box-shadow: 0 4px 10px rgba(239, 138, 44, 0.28);
      color: #fff;
    }
    .path-btn.secondary {
      background: #fff1df;
      color: #e07d2c;
    }
    .map-row {
      align-items: start;
      display: grid;
      gap: 13px;
      grid-template-columns: 84px minmax(0, 1fr);
      margin-bottom: 13px;
    }
    .row-label { padding-top: 8px; }
    .week-pill {
      background: #d8c489;
      border-radius: 8px;
      color: #5f5230;
      display: inline-block;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
      padding: 4px 11px;
      white-space: nowrap;
    }
    .row-tags {
      color: #897748;
      font-size: 12px;
      line-height: 1.75;
    }
    .task-grid {
      display: grid;
      gap: 13px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .task-card {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 13px;
      box-shadow: 0 2px 6px rgba(140, 110, 40, 0.10);
      display: flex;
      flex-direction: column;
      min-height: 154px;
      padding: 12px 13px;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .task-card.compact {
      cursor: pointer;
      min-height: 136px;
    }
    .task-card.compact:focus-visible {
      border-color: var(--path-gold);
      box-shadow: 0 0 0 3px rgba(232, 144, 47, 0.22), 0 8px 16px rgba(140, 110, 40, 0.18);
      outline: none;
    }
    .task-card:hover {
      border-color: var(--path-gold);
      box-shadow: 0 8px 16px rgba(140, 110, 40, 0.18);
      transform: translateY(-2px);
    }
    .task-card.featured {
      background: var(--card-hot);
      border-color: var(--path-gold);
      box-shadow: 0 8px 18px rgba(232, 144, 47, 0.22);
    }
    .task-head {
      align-items: center;
      color: var(--path-faint);
      display: flex;
      font-size: 11.5px;
      justify-content: space-between;
      margin-bottom: 7px;
      min-height: 18px;
    }
    .task-emoji {
      font-size: 23px;
      line-height: 1;
      margin-bottom: 7px;
    }
    .task-title {
      color: var(--path-text);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 5px;
    }
    .task-goal {
      color: var(--path-soft);
      font-size: 12px;
      line-height: 1.42;
    }
    .task-quota {
      color: var(--path-soft);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      margin-top: 4px;
    }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
    }
    .tiny-note {
      color: #897748;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 14px;
    }
    .my-task {
      background: rgba(253, 247, 230, 0.7);
      border-style: dashed;
    }
    .claim-empty {
      grid-column: 1 / -1;
      min-height: 118px;
    }
    .claim-card .task-actions {
      padding-top: 10px;
    }
    .claim-status {
      color: var(--path-gold-dark);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.4;
      margin-top: 6px;
    }
    .dialog-backdrop {
      align-items: center;
      background: rgba(48, 39, 20, 0.34);
      display: none;
      inset: 0;
      justify-content: center;
      padding: 18px;
      position: fixed;
      z-index: 50;
    }
    .dialog-backdrop.visible { display: flex; }
    .detail-card {
      background: #fffaf0;
      border: 2px solid var(--path-line);
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(67, 49, 18, 0.24);
      color: var(--path-text);
      max-height: min(720px, calc(100vh - 36px));
      max-width: 560px;
      overflow: auto;
      padding: 18px;
      width: 100%;
    }
    .detail-top {
      align-items: flex-start;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .detail-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.25;
    }
    .detail-meta {
      color: var(--path-soft);
      display: flex;
      flex-wrap: wrap;
      font-size: 13px;
      font-weight: 800;
      gap: 8px;
      margin-top: 6px;
    }
    .detail-close {
      background: #fff1df;
      border: 0;
      border-radius: 9px;
      color: #b16624;
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
      height: 36px;
      line-height: 1;
      width: 36px;
    }
    .detail-section {
      border-top: 1px solid #efd9ac;
      padding: 12px 0;
    }
    .detail-section h3 {
      color: #6b5629;
      font-size: 13px;
      margin: 0 0 6px;
    }
    .detail-section p {
      color: var(--path-text);
      font-size: 14px;
      line-height: 1.65;
      margin: 0;
      white-space: pre-wrap;
    }
    .detail-warning {
      background: #fff0df;
      border: 1px solid #efbf8b;
      border-radius: 10px;
      color: #a85b1f;
      font-size: 13px;
      font-weight: 900;
      margin: 8px 0 12px;
      padding: 8px 10px;
    }
    .detail-note {
      color: var(--path-soft);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.55;
      margin-top: 10px;
    }
    .task-actions [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .hero { align-items: stretch; flex-direction: column; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .order { grid-template-columns: auto minmax(0, 1fr); }
      .order-actions { grid-column: 1 / -1; }
      main.wrap { padding: 18px 16px 40px; }
      .hero-map { align-items: flex-start; flex-direction: column; padding: 16px; }
      .hero-actions { justify-content: flex-start; width: 100%; }
      .path-btn { flex: 1 1 auto; }
      .map-row { grid-template-columns: 1fr; gap: 8px; }
      .row-label { padding-top: 10px; }
      .row-tags { display: inline; margin-left: 8px; }
      .task-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      main { padding-inline: 12px; }
      .stats { grid-template-columns: 1fr; }
      .order { align-items: flex-start; }
      .btn { width: 100%; }
      .task-grid { grid-template-columns: 1fr; }
      .path-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero-map">
      <span class="hero-badge">📍 专心做 1 单</span>
      <span class="hero-emoji">💰</span>
      <div class="hero-copy">
        <div class="hero-titleline">
          <span class="hero-meta">D5-6 · 接单剪辑</span>
          <span class="tag">真实模拟</span>
          <span class="hero-title">提交后可接下一单</span>
        </div>
        <div class="hero-goal">抢单是制作资格，采用才发钱；同一单的审核记录会保留。</div>
      </div>
      <div class="hero-actions">
        <a class="path-btn secondary" href="/projects">我的项目</a>
        <button class="path-btn primary" id="refresh-btn" type="button">刷新任务</button>
      </div>
    </section>

    <div class="error" id="error"></div>

    <section class="map-row">
      <div class="row-label">
        <span class="week-pill">今日可抢</span>
        <div class="row-tags">任务名<br>价格<br>状态</div>
      </div>
      <div class="task-grid" id="dispatch-tasks">
        <div class="empty">正在加载…</div>
      </div>
    </section>

    <section class="map-row">
      <div class="row-label">
        <span class="week-pill">我的接单</span>
        <div class="row-tags">真实记录<br>上线后显示</div>
      </div>
      <div class="task-grid" id="my-task-preview">
        <article class="task-card my-task claim-empty">
          <span class="task-head"><span>还没有接单记录</span><span class="tag">先看需求</span></span>
          <span class="task-emoji">🧾</span>
          <span class="task-title">先点任务看需求，再抢单开始剪</span>
          <span class="task-goal">抢过的任务会在这里显示制作中、待审核和已完成。</span>
        </article>
      </div>
    </section>

    <p class="tiny-note">任务卡会显示可抢人数和当前状态；点开卡片先看完整需求，再在详情里抢单。提交审核绑定订单会在下一步接入。</p>
  </main>

  <div class="dialog-backdrop" id="task-dialog" aria-hidden="true">
    <article class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-top">
        <div>
          <div class="detail-title" id="detail-title">任务需求</div>
          <div class="detail-meta" id="detail-meta"></div>
        </div>
        <button class="detail-close" id="detail-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="detail-warning"></div>
      <div class="detail-section">
        <h3>成品目标</h3>
        <p id="detail-target"></p>
      </div>
      <div class="detail-section">
        <h3>必须保留</h3>
        <p id="detail-keep"></p>
      </div>
      <div class="detail-section">
        <h3>必须删除</h3>
        <p id="detail-remove"></p>
      </div>
      <div class="detail-section">
        <h3>提交重点</h3>
        <p id="detail-submit"></p>
      </div>
      <div class="task-actions">
        <a class="path-btn primary" id="detail-start" href="#">抢单并开始剪</a>
        <a class="path-btn secondary" id="detail-audio" href="#" target="_blank" rel="noopener">听原音</a>
        <button class="path-btn secondary" id="detail-back" type="button">再看看</button>
      </div>
      <div class="detail-note">点“抢单并开始剪”后，这单会进入“我的接单 / 制作中”。</div>
    </article>
  </div>

  <script type="module">
    import { apiJson } from '../js/api.js?v=20260610-reviewflow-1';
    import { initStationNav } from '../js/station-nav.js?v=20260612-unlock';

    let dispatchTasks = [];
    let dispatchClaims = [];

    const auth = await initStationNav({ active: 'orders', requireDay2: true });
    document.getElementById('refresh-btn')?.addEventListener('click', () => loadDispatchTasks());
    document.getElementById('detail-start')?.addEventListener('click', handleDetailStart);
    document.getElementById('detail-close')?.addEventListener('click', closeTaskDialog);
    document.getElementById('detail-back')?.addEventListener('click', closeTaskDialog);
    document.getElementById('task-dialog')?.addEventListener('click', (event) => {
      if (event.target.id === 'task-dialog') closeTaskDialog();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeTaskDialog();
    });
    if (auth) loadDispatchTasks();

    async function loadDispatchTasks() {
      const root = document.getElementById('dispatch-tasks');
      root.innerHTML = '<div class="empty">正在加载真实任务…</div>';
      try {
        const [data, claimData] = await Promise.all([
          apiJson('/api/orders/tasks'),
          apiJson('/api/orders/my-claims').catch(() => ({ claims: [] })),
        ]);
        dispatchTasks = (Array.isArray(data.tasks) ? data.tasks : []).map(normalizeTask);
        dispatchClaims = (Array.isArray(claimData.claims) ? claimData.claims : []).map(normalizeClaim);
      } catch (error) {
        root.innerHTML = '<div class="empty">任务加载失败，请刷新。</div>';
        return;
      }
      renderMyClaims();
      if (!dispatchTasks.length) {
        root.innerHTML = '<div class="empty">还没有发布中的接单任务。</div>';
        return;
      }
      root.innerHTML = dispatchTasks.map((task, index) => `
        <article class="task-card compact ${index === 0 ? 'featured' : ''}" role="button" tabindex="0" data-task-id="${escapeAttr(task.id)}" aria-label="查看${escapeAttr(task.title)}需求">
          <span class="task-head"><span>#${escapeHtml(task.id)} · ${escapeHtml(task.price)}</span><span class="tag">${escapeHtml(task.quota)}</span></span>
          <span class="task-emoji">${escapeHtml(task.emoji)}</span>
          <span class="task-title">${escapeHtml(task.title)}</span>
          <span class="task-quota">${escapeHtml(task.progress)}</span>
        </article>`).join('');
      root.querySelectorAll('[data-task-id]').forEach((card) => {
        card.addEventListener('click', () => openTaskDialog(card.dataset.taskId));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openTaskDialog(card.dataset.taskId);
          }
        });
      });
    }

    function renderMyClaims() {
      const root = document.getElementById('my-task-preview');
      if (!root) return;
      if (!dispatchClaims.length) {
        root.innerHTML = `
          <article class="task-card my-task claim-empty">
            <span class="task-head"><span>还没有接单记录</span><span class="tag">先看需求</span></span>
            <span class="task-emoji">🧾</span>
            <span class="task-title">先点任务看需求，再抢单开始剪</span>
            <span class="task-goal">抢过的任务会在这里显示制作中、待审核和已完成。</span>
          </article>`;
        return;
      }
      root.innerHTML = dispatchClaims.map((claim) => `
        <article class="task-card my-task claim-card">
          <span class="task-head"><span>${escapeHtml(claimStatusLabel(claim.status))}</span><span class="tag">#${escapeHtml(claim.taskId)}</span></span>
          <span class="task-emoji">${escapeHtml(inferEmoji(claim.task.title, claim.task.demand))}</span>
          <span class="task-title">${escapeHtml(claim.task.title || '未命名任务')}</span>
          <span class="task-goal">${escapeHtml(claim.task.budget || '待定')} · ${escapeHtml(formatClaimTime(claim.updatedAt || claim.claimedAt))}</span>
          <span class="claim-status">${escapeHtml(claimStatusHint(claim))}</span>
          <div class="task-actions">
            ${isAutoAudioMaterial(claim.task.materialLink)
              ? `<a class="path-btn primary" href="/edit?task=${encodeURIComponent(claim.taskId)}&claim=${encodeURIComponent(claim.id)}">${escapeHtml(claimPrimaryAction(claim.status))}</a>`
              : claim.task.materialLink
                ? `<a class="path-btn primary" href="${escapeAttr(claim.task.materialLink)}" target="_blank" rel="noopener">打开素材下载</a><a class="path-btn secondary" href="/edit">去剪辑台上传</a>`
              : `<button class="path-btn primary" type="button" disabled>等待音频素材</button>`}
            <button class="path-btn secondary" type="button" data-abandon-claim="${escapeAttr(claim.id)}" ${canAbandonClaim(claim.status) ? '' : 'hidden'}>放弃此单</button>
          </div>
        </article>`).join('');
      root.querySelectorAll('[data-abandon-claim]').forEach((button) => {
        button.addEventListener('click', () => abandonClaim(button.dataset.abandonClaim));
      });
    }

    function openTaskDialog(taskId) {
      const task = dispatchTasks.find((item) => String(item.id) === String(taskId));
      if (!task) return;
      document.getElementById('detail-title').textContent = `${task.title} · ${task.price}`;
      document.getElementById('detail-meta').textContent = `#${task.id} · ${task.type} · ${task.quota}`;
      document.getElementById('detail-warning').innerHTML = task.warning ? `<div class="detail-warning">${escapeHtml(task.warning)}</div>` : '';
      document.getElementById('detail-target').textContent = task.target;
      document.getElementById('detail-keep').textContent = task.keep;
      document.getElementById('detail-remove').textContent = task.remove;
      document.getElementById('detail-submit').textContent = task.submit;
      const audio = document.getElementById('detail-audio');
      const start = document.getElementById('detail-start');
      audio.href = task.materialLink || '#';
      audio.hidden = !task.materialLink;
      start.dataset.taskId = task.id;
      start.href = detailStartHref(task);
      start.textContent = detailStartText(task);
      start.setAttribute('aria-disabled', canStartTask(task) ? 'false' : 'true');
      const dialog = document.getElementById('task-dialog');
      dialog.classList.add('visible');
      dialog.setAttribute('aria-hidden', 'false');
    }

    async function handleDetailStart(event) {
      const start = event.currentTarget;
      const task = dispatchTasks.find((item) => String(item.id) === String(start.dataset.taskId));
      if (!task || !canStartTask(task)) {
        event.preventDefault();
        return;
      }
      if (task.myClaim) return;
      event.preventDefault();
      start.textContent = '正在抢单…';
      start.setAttribute('aria-disabled', 'true');
      try {
        const data = await apiJson(`/api/orders/tasks/${encodeURIComponent(task.id)}/claim`, { method: 'POST' });
        if (data.claim) {
          task.myClaim = normalizeClaim(data.claim);
          dispatchClaims = mergeClaim(dispatchClaims, task.myClaim);
        }
        if (data.task) {
          const nextTask = normalizeTask(data.task);
          dispatchTasks = dispatchTasks.map((item) => String(item.id) === String(nextTask.id) ? nextTask : item);
        }
        renderMyClaims();
        if (isAutoAudioMaterial(task.materialLink)) {
          location.href = `/edit?task=${encodeURIComponent(task.id)}&claim=${encodeURIComponent(data.claim?.id || task.myClaim?.id || '')}`;
        } else {
          closeTaskDialog();
          await loadDispatchTasks();
        }
      } catch (error) {
        document.getElementById('detail-warning').innerHTML = `<div class="detail-warning">${escapeHtml(error?.message || '抢单失败，请刷新后重试。')}</div>`;
        start.textContent = detailStartText(task);
        start.setAttribute('aria-disabled', 'false');
      }
    }

    async function abandonClaim(id) {
      if (!id) return;
      try {
        await apiJson(`/api/orders/claims/${encodeURIComponent(id)}/abandon`, { method: 'POST' });
        dispatchClaims = dispatchClaims.filter((claim) => String(claim.id) !== String(id));
        await loadDispatchTasks();
      } catch (error) {
        alert(error?.message || '放弃失败，请刷新后重试。');
      }
    }

    function normalizeTask(task) {
      const demand = String(task.demand || '').trim();
      const sections = parseDemand(demand);
      const title = task.title || `接单任务 ${task.id}`;
      return {
        id: String(task.id),
        title,
        price: task.budget || extractPrice(demand) || '待定',
        quota: buildQuotaLabel(task),
        progress: buildProgressLabel(task),
        claimCount: Number(task.claimCount || task.claim_count || 0),
        maxClaims: Number(task.maxClaims || task.max_claims || 5),
        emoji: inferEmoji(title, demand),
        type: task.difficulty || inferType(title, demand),
        visibility: task.visibility || 'public',
        assigneeLabel: task.assigneeLabel || task.assigneeRefs || '',
        canClaim: task.canClaim !== false,
        claimBlockedReason: task.claimBlockedReason || '',
        warning: task.visibility === 'assigned' ? `私密单，仅限 ${task.assigneeLabel || '指定学员'} 接单。其他学员可看需求，但不能抢单。` : '',
        target: [sections.intro, sections.target].filter(Boolean).join('\n\n') || demand || '后台还没有填写任务需求。',
        keep: sections.keep || '按任务需求保留核心信息。',
        remove: sections.remove || '删掉直播语境、重复废话和影响听感的部分。',
        submit: sections.submit || sections.ad || '提交前确认符合任务需求，并能顺畅收听。',
        materialLink: task.materialLink || '',
        myClaim: task.myClaim ? normalizeClaim(task.myClaim) : null,
      };
    }

    function normalizeClaim(claim) {
      const task = claim.task || {};
      return {
        id: String(claim.id || ''),
        taskId: String(claim.taskId || claim.task_id || task.id || ''),
        status: claim.status || 'in_progress',
        claimedAt: claim.claimedAt || claim.claimed_at || '',
        updatedAt: claim.updatedAt || claim.updated_at || '',
        submittedAt: claim.submittedAt || claim.submitted_at || '',
        task: {
          id: String(task.id || claim.taskId || claim.task_id || ''),
          title: task.title || '',
          budget: task.budget || '',
          demand: task.demand || '',
          materialLink: task.materialLink || task.material_link || '',
          visibility: task.visibility || 'public',
          assigneeLabel: task.assigneeLabel || task.assignee_refs || '',
        },
      };
    }

    function mergeClaim(list, next) {
      const without = list.filter((claim) => String(claim.id) !== String(next.id));
      return [next, ...without];
    }

    function buildQuotaLabel(task) {
      const maxClaims = Number(task.maxClaims || task.max_claims || 5);
      const claimCount = Number(task.claimCount || task.claim_count || 0);
      if (task.visibility === 'assigned') return '私密单';
      if (claimCount >= maxClaims) return `已满 · ${claimCount}/${maxClaims}`;
      return `可抢 · ${claimCount}/${maxClaims}`;
    }

    function buildProgressLabel(task) {
      const maxClaims = Number(task.maxClaims || task.max_claims || 5);
      const claimCount = Number(task.claimCount || task.claim_count || 0);
      const reviewingCount = Number(task.reviewingCount || task.reviewing_count || 0);
      const adopted = Boolean(task.adoptedSubmissionId || task.adopted_submission_id);
      if (task.visibility === 'assigned') return `仅 ${task.assigneeLabel || '指定学员'} 可接`;
      if (adopted) return '已采用，任务结束';
      if (reviewingCount > 0) return `${reviewingCount} 人待审核`;
      return `还可抢 ${Math.max(maxClaims - claimCount, 0)} 人`;
    }

    function canStartTask(task) {
      if (task?.canClaim === false) return false;
      if (task.myClaim) return true;
      return Number(task.claimCount || 0) < Number(task.maxClaims || 5);
    }

    function detailStartText(task) {
      if (task.canClaim === false) return task.claimBlockedReason || '仅指定学员可接';
      if (!task.materialLink && task.myClaim) return '已抢单，等待音频';
      if (!task.materialLink) return '抢单，等待音频';
      if (!isAutoAudioMaterial(task.materialLink) && task.myClaim) return '已抢单，先下载素材';
      if (!isAutoAudioMaterial(task.materialLink)) return '抢单，先下载素材';
      if (task.myClaim) return '继续剪辑';
      if (Number(task.claimCount || 0) >= Number(task.maxClaims || 5)) return '名额已满';
      return '抢单并开始剪';
    }

    function detailStartHref(task) {
      if (!task.materialLink || !task.myClaim) return '#';
      return `/edit?task=${encodeURIComponent(task.id)}&claim=${encodeURIComponent(task.myClaim.id)}`;
    }

    function isAutoAudioMaterial(value) {
      const link = String(value || '').trim();
      if (!link) return false;
      if (/^\/api\/orders\/material\//.test(link)) return true;
      return /\.(mp3|m4a|wav|aac|flac)(?:[?#].*)?$/i.test(link);
    }

    function claimStatusLabel(status) {
      const labels = {
        in_progress: '制作中',
        returned: '打回修改',
        submitted: '待审核',
        completed: '已完成',
      };
      return labels[status] || '制作中';
    }

    function claimStatusHint(claimOrStatus) {
      const claim = typeof claimOrStatus === 'object' ? claimOrStatus : null;
      const status = claim ? claim.status : claimOrStatus;
      if (claim && !claim.task.materialLink) return '已抢单，等待后台补音频素材。';
      if (claim && claim.task.materialLink && !isAutoAudioMaterial(claim.task.materialLink)) return '已抢单，请先打开素材链接下载音频，再去剪辑台上传。';
      const hints = {
        in_progress: '已抢单，可以继续剪辑。',
        returned: '按助教意见修改后重新提交。',
        submitted: '已提交，之后可以抢下一单。',
        completed: '这单已经结束。',
      };
      return hints[status] || hints.in_progress;
    }

    function claimPrimaryAction(status) {
      if (status === 'submitted') return '查看项目';
      if (status === 'completed') return '查看结果';
      return '继续剪辑';
    }

    function canAbandonClaim(status) {
      return status === 'in_progress' || status === 'returned';
    }

    function formatClaimTime(value) {
      if (!value) return '刚刚';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return `${date.getMonth() + 1}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    function parseDemand(text) {
      const result = {};
      const firstHeading = text.search(/\n\s*(成品目标|必须保留|必须删除|广告\/引流口径|广告|提交重点)[:：]/);
      if (firstHeading > 0) result.intro = text.slice(0, firstHeading).trim();
      const pairs = [
        ['target', /成品目标[:：]([\s\S]*?)(?=\n\s*(必须保留|必须删除|广告\/引流口径|广告|提交重点)[:：]|$)/],
        ['keep', /必须保留[:：]([\s\S]*?)(?=\n\s*(必须删除|广告\/引流口径|广告|提交重点)[:：]|$)/],
        ['remove', /必须删除[:：]([\s\S]*?)(?=\n\s*(广告\/引流口径|广告|提交重点)[:：]|$)/],
        ['ad', /广告\/引流口径[:：]([\s\S]*?)(?=\n\s*提交重点[:：]|$)/],
        ['submit', /提交重点[:：]([\s\S]*?)$/],
      ];
      pairs.forEach(([key, pattern]) => {
        const match = text.match(pattern);
        if (match?.[1]) result[key] = match[1].trim();
      });
      if (result.ad && result.submit) result.submit = `${result.ad}\n\n${result.submit}`;
      return result;
    }

    function extractPrice(text) {
      const match = String(text || '').match(/(\d+\s*元)/);
      return match ? match[1].replace(/\s+/g, '') : '';
    }

    function inferType(title, demand) {
      const text = `${title} ${demand}`;
      if (/连线|发售/.test(text)) return '发售连线';
      if (/咨询/.test(text)) return '咨询录音';
      if (/访谈/.test(text)) return '访谈播客';
      if (/广告|招商/.test(text)) return '广告单';
      return '真实任务';
    }

    function inferEmoji(title, demand) {
      const text = `${title} ${demand}`;
      if (/连线|访谈/.test(text)) return '🎧';
      if (/咨询/.test(text)) return '💬';
      if (/广告|招商/.test(text)) return '🧩';
      return '🎙️';
    }

    function closeTaskDialog() {
      const dialog = document.getElementById('task-dialog');
      dialog.classList.remove('visible');
      dialog.setAttribute('aria-hidden', 'true');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
