<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金钱剪刀 · 后台</title>
  <link rel="stylesheet" href="css/shared.css?v=20260529b">
  <style>
    /* hidden 必须真隐藏：.toolbar-row/.inline-btn 的 display 会盖过 [hidden]，
       导致切到非用户列表页签时筛选行/导出按钮仍漏出。这里统一兜底。 */
    [hidden] { display: none !important; }
    .cell-link { color:#C8820A; font-weight:700; cursor:pointer; text-decoration:none; background:none; border:none; padding:0; font-size:inherit; }
    .cell-link:hover { text-decoration:underline; }
    .cell-muted { color:#9a9a9a; }
    .pending-pill { display:inline-block; min-width:20px; padding:1px 8px; border-radius:999px; background:#FBE7C2; color:#9a5a00; font-weight:800; }
    .pending-zero { color:#b8b8b8; }
    .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:9999; padding:20px; }
    .modal-mask.open { display:flex; }
    .modal-box { background:#fff; border-radius:16px; max-width:560px; width:100%; max-height:84vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.25); }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; }
    .modal-title { font-size:18px; font-weight:800; }
    .modal-close { border:none; background:none; font-size:22px; cursor:pointer; color:#888; line-height:1; }
    .modal-body { padding:18px 22px 24px; }
    .intro-q { font-size:13px; color:#B07A18; font-weight:700; margin:14px 0 4px; }
    .intro-a { font-size:15px; line-height:1.6; color:#333; white-space:pre-wrap; }
    .intro-empty { color:#999; padding:10px 0; }
    .snap-item { border:1px solid #eee; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
    .snap-meta { font-size:13px; color:#666; margin-bottom:8px; }
    .ai-review { font-size:14px; color:#333; }
    .ai-pill { display:inline-block; font-weight:800; padding:4px 12px; border-radius:999px; margin-bottom:12px; }
    .ai-pill.ok { background:#E6F6EC; color:#1A7F3C; }
    .ai-pill.warn { background:#FDEEE0; color:#B05A18; }
    .ai-score { background:#FAFAFA; border:1px solid #eee; border-radius:10px; padding:10px 12px; margin-bottom:10px; font-weight:600; }
    .ai-human { background:#FFF7E6; border:1px solid #F0D89B; border-radius:10px; padding:10px 12px; margin-bottom:14px; color:#8A5A12; }
    .ai-label { display:block; font-size:13px; font-weight:700; color:#555; margin-bottom:6px; }
    .ai-textarea { width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; resize:vertical; font-family:inherit; }
    .ai-actions { display:flex; align-items:center; gap:10px; margin:10px 0; }
    .ai-muted { font-size:12px; color:#999; }
    .snap-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .feedback-summary { display:grid; gap:12px; grid-template-columns:repeat(4, minmax(0, 1fr)); margin-bottom:16px; }
    .feedback-card { background:#FFFBF0; border:1px solid #F0D89B; border-radius:12px; padding:12px 14px; }
    .feedback-num { color:#9A5A00; font-size:24px; font-weight:900; line-height:1.1; }
    .feedback-label { color:#7A6A46; font-size:12px; font-weight:800; margin-top:4px; }
    .feedback-digest { background:#FAFAFA; border:1px solid #eee; border-radius:12px; color:#555; font-size:13px; line-height:1.7; margin-bottom:16px; padding:12px 14px; }
    .feedback-title { color:#333; font-weight:800; margin-bottom:4px; }
    .feedback-desc { color:#666; max-width:28em; white-space:pre-wrap; }
    .feedback-meta { color:#999; font-size:12px; line-height:1.6; }
    .feedback-status { border-radius:999px; display:inline-block; font-size:12px; font-weight:800; padding:3px 9px; }
    .feedback-status.open { background:#FDEEE0; color:#B05A18; }
    .feedback-status.triaged { background:#EAF2FF; color:#245AA8; }
    .feedback-status.resolved { background:#E6F6EC; color:#1A7F3C; }
    .feedback-status.ignored { background:#F1F1F1; color:#777; }
    .feedback-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .feedback-note { min-width:180px; width:100%; }
    .health-summary { display:grid; gap:12px; grid-template-columns:repeat(5, minmax(0, 1fr)); margin-bottom:16px; }
    .health-card { background:#F8FBFF; border:1px solid #DCE8F7; border-radius:12px; padding:12px 14px; }
    .health-num { color:#245AA8; font-size:24px; font-weight:900; line-height:1.1; }
    .health-label { color:#52657A; font-size:12px; font-weight:800; margin-top:4px; }
    .health-strip { background:#FAFAFA; border:1px solid #eee; border-radius:12px; color:#555; font-size:13px; line-height:1.7; margin-bottom:16px; padding:12px 14px; }
    .health-ok { color:#1A7F3C; font-weight:800; }
    .health-warn { color:#B05A18; font-weight:800; }
    .mono-small { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; color:#666; }
    @media (max-width: 760px) {
      .feedback-summary { grid-template-columns:repeat(2, minmax(0, 1fr)); }
      .health-summary { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell shell-wide">
    <header class="top-chrome">
      <div>
        <div class="top-title">金钱剪刀 后台</div>
        <div class="top-sub">用户列表、使用次数和微信跟进状态。</div>
      </div>
      <div class="top-actions">
        <a class="secondary-btn inline-btn" href="/orders-review-admin.html">订单审核</a>
        <a class="secondary-btn inline-btn" href="/orders/admin">接单台后台</a>
        <a class="secondary-btn inline-btn" href="/" id="home-link">回到工具</a>
        <span class="user-chip" id="user-phone"></span>
        <button class="secondary-btn inline-btn" id="logout-btn" type="button">退出</button>
      </div>
    </header>

    <section class="card">
      <div class="toolbar-row">
        <div class="segmented">
          <button class="segmented-btn active" data-view="users" type="button">用户列表</button>
          <button class="segmented-btn" data-view="snapshots" type="button">审核快照</button>
          <button class="segmented-btn" data-view="feedback" type="button">问题反馈</button>
          <button class="segmented-btn" data-view="downloadHealth" type="button">导出健康</button>
          <button class="segmented-btn" data-view="visits" type="button">访问统计</button>
        </div>
        <button class="secondary-btn inline-btn" id="export-btn" type="button">导出 CSV</button>
        <button class="secondary-btn inline-btn" id="feedback-copy-btn" type="button" hidden>复制今日晨报</button>
      </div>
      <div class="toolbar-row" id="user-filter-row">
        <div class="segmented">
          <button class="segmented-btn active" data-filter="all" type="button">全部</button>
          <button class="segmented-btn" data-filter="used_3" type="button">≥3次</button>
          <button class="segmented-btn" data-filter="pending" type="button">有待审</button>
        </div>
      </div>
      <div class="error" id="error"></div>
      <div class="table-wrap" id="users-panel">
        <table class="data-table">
          <thead>
            <tr>
              <th>手机号</th>
              <th>微信名</th>
              <th>注册时间</th>
              <th>最后活跃</th>
              <th>次数</th>
              <th>D1作业</th>
              <th>D2作业</th>
              <th>PDCA</th>
              <th>简历</th>
              <th>待审核</th>
              <th>备注</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="user-table-body"></tbody>
        </table>
      </div>
      <div class="table-wrap" id="snapshots-panel" hidden>
        <table class="data-table">
          <thead>
            <tr>
              <th>项目</th>
              <th>剪辑师</th>
              <th>导出时间</th>
              <th>状态</th>
              <th>原始</th>
              <th>粗剪</th>
              <th>删减</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="snapshot-table-body"></tbody>
        </table>
      </div>
      <div id="feedback-panel" hidden>
        <div class="feedback-summary" id="feedback-summary"></div>
        <div class="feedback-digest" id="feedback-digest"></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>问题</th>
                <th>位置</th>
                <th>学员</th>
                <th>状态</th>
                <th>处理</th>
              </tr>
            </thead>
            <tbody id="feedback-table-body"></tbody>
          </table>
        </div>
      </div>
      <div id="download-health-panel" hidden>
        <div class="health-summary" id="download-health-summary"></div>
        <div class="health-strip" id="download-health-strip"></div>
        <div class="toolbar-row">
          <button class="secondary-btn inline-btn" id="download-health-refresh" type="button">刷新导出健康</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>学员</th>
                <th>事件</th>
                <th>阶段</th>
                <th>说明</th>
                <th>浏览器</th>
              </tr>
            </thead>
            <tbody id="download-health-table-body"></tbody>
          </table>
        </div>
      </div>
      <div id="visits-panel" hidden>
        <div class="health-summary" id="visits-summary"></div>
        <div class="health-strip" id="visits-strip"></div>
        <div class="toolbar-row">
          <button class="secondary-btn inline-btn" id="visits-refresh" type="button">刷新访问统计</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>最近活跃学员</th>
                <th>最后出现</th>
                <th>所在页面</th>
              </tr>
            </thead>
            <tbody id="visits-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-mask" id="modal-mask">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">学员作业</div>
        <button class="modal-close" id="modal-close" type="button">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/admin.js?v=20260628-download-health"></script>
</body>
</html>
